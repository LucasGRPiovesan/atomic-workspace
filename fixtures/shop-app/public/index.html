<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #eee; margin-bottom: 1rem; }
    .cart-badge { background: #e00; color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.8rem; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
    .product-card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
    .product-card h3 { margin-bottom: 0.5rem; }
    .product-card .price { color: #2a7; font-weight: bold; font-size: 1.2rem; margin: 0.5rem 0; }
    .product-card button { width: 100%; padding: 0.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .product-card button:hover { background: #0052a3; }
    .product-detail { display: none; }
    .product-detail.active { display: block; }
    .detail-image { width: 100%; max-width: 400px; background: #f5f5f5; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; color: #999; margin: 1rem 0; }
    .detail-actions { display: flex; gap: 1rem; margin-top: 1rem; }
    .detail-actions button { padding: 0.75rem 1.5rem; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .detail-actions button.secondary { background: #666; }
    .cart-view, .order-view { display: none; }
    .cart-view.active, .order-view.active { display: block; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem; border-bottom: 1px solid #eee; }
    .cart-item button { background: #e00; color: white; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; }
    .cart-summary { margin-top: 1rem; padding: 1rem; background: #f9f9f9; border-radius: 8px; }
    .cart-summary .row { display: flex; justify-content: space-between; margin: 0.5rem 0; }
    .cart-summary .total { font-weight: bold; font-size: 1.2rem; }
    .checkout-btn { width: 100%; padding: 1rem; background: #2a7; color: white; border: none; border-radius: 4px; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; }
    .checkout-btn:disabled { background: #999; cursor: not-allowed; }
    .order-confirmation { text-align: center; padding: 2rem; }
    .order-confirmation h2 { color: #2a7; margin-bottom: 1rem; }
    .order-details { text-align: left; max-width: 500px; margin: 0 auto 2rem; padding: 1rem; background: #f9f9f9; border-radius: 8px; }
    .order-details .row { display: flex; justify-content: space-between; margin: 0.5rem 0; }
    .cancel-btn { padding: 0.75rem 1.5rem; background: #e00; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .hidden { display: none !important; }
    .error { color: #e00; padding: 1rem; background: #fee; border-radius: 4px; margin: 1rem 0; }
    .loading { text-align: center; padding: 2rem; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>Shop App</h1>
    <div>
      <a href="#/" data-nav="home">Home</a> |
      <a href="#/cart" data-nav="cart">Cart <span id="cart-count" class="cart-badge">0</span></a>
    </div>
  </header>

  <main id="app">
    <div id="home-view" class="product-grid"></div>

    <div id="product-view" class="product-detail">
      <button id="back-btn" class="secondary">← Back to products</button>
      <div id="product-detail"></div>
    </div>

    <div id="cart-view" class="cart-view">
      <h2>Shopping Cart</h2>
      <div id="cart-items"></div>
      <div id="cart-summary" class="cart-summary"></div>
      <button id="checkout-btn" class="checkout-btn" disabled>Checkout</button>
    </div>

    <div id="order-view" class="order-view">
      <div class="order-confirmation">
        <h2>Order Confirmed!</h2>
        <div id="order-details" class="order-details"></div>
        <button id="cancel-order-btn" class="cancel-btn">Cancel Order</button>
      </div>
    </div>

    <div id="error-container"></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
